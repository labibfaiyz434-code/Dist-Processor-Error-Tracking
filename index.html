    case 'saveTourState':{const {error}=await c.rpc('tourflow_save_tour_state',{p_tour_id:m.payload.tourId,p_state:m.payload.state});if(error)throw error;return true}
    case 'directory':{const [a,b]=await Promise.all([c.rpc('tourflow_list_daily_members'),c.from('tourflow_people_directory').select('id,source_user_id,name,initial,phone,email,gender,date_of_birth,emergency_contact,notes,active').eq('active',true).order('name')]);if(a.error)throw a.error;if(b.error)throw b.error;return {daily:a.data||[],tourflow:b.data||[]}}
    case 'createPerson':{const p=m.payload.person||{};const {data,error}=await c.from('tourflow_people_directory').insert({source_type:'tourflow',name:p.name,initial:p.initial||null,phone:p.phone||null,email:p.email||null,gender:p.gender||null,date_of_birth:p.date_of_birth||null,emergency_contact:p.emergency_contact||null,notes:p.notes||null}).select('id,source_user_id,name,initial,phone,email,gender,date_of_birth,emergency_contact,notes,active').single();if(error)throw error;return data}
    case 'exportTour':{const {data,error}=await c.rpc('tourflow_export_tour',{p_tour_id:m.payload.tourId});if(error)throw error;return data}
    case 'markBackup':{const {data,error}=await c.rpc('tourflow_mark_backup_exported',{p_tour_id:m.payload.tourId,p_sha256:m.payload.sha256,p_record_count:m.payload.recordCount});if(error)throw error;return data}
    case 'deleteTour':{const {error}=await c.rpc('tourflow_delete_tour',{p_tour_id:m.payload.tourId,p_confirm_name:m.payload.confirmName});if(error)throw error;return true}
    default:throw new Error('Unsupported TourFlow operation');
  }
}
window.addEventListener('message',async e=>{
  const m=e.data||{};
  if(e.source===tour.contentWindow){
    if(m.type==='TF_CHILD_READY'){childReady=true;return}
    if(m.type==='TF_EXIT_TO_DAILY_OVERVIEW'){exitTour();return}
    if(m.type==='TF_REQUEST'){try{const data=await handleRequest(m);tour.contentWindow.postMessage({type:'TF_RESPONSE',requestId:m.requestId,ok:true,data},'*')}catch(err){tour.contentWindow.postMessage({type:'TF_RESPONSE',requestId:m.requestId,ok:false,error:err?.message||String(err)},'*')}return}
  }
});
async function bootApp(){
  try{
    const r=await fetch(BASE_URL+'?tf='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Pinned DAILY OVERVIEW baseline returned HTTP '+r.status);let source=await r.text();
    // Add TourFlow to the existing permission editor and page permission map BEFORE original scripts execute.
    source=source.replace("{name:'Anonymous Voice',items:","{name:'TourFlow',items:[['tourflow.view','TourFlow — Open module'],['tourflow.view_all','TourFlow — View all tours'],['tourflow.create','TourFlow — Create tours'],['tourflow.edit_own','TourFlow — Edit owned/shared tours'],['tourflow.edit_all','TourFlow — Edit all tours'],['tourflow.people.manage','TourFlow — Manage reusable people directory'],['tourflow.manage_access','TourFlow — Share owned tours'],['tourflow.delete_own','TourFlow — Delete owned tours after backup'],['tourflow.delete_all','TourFlow — Delete any tour after backup'],['tourflow.audit.view','TourFlow — View audit history']]} ,\n  {name:'Anonymous Voice',items:");
    source=source.replace("management:'management.view'};","management:'management.view',tourflow:'tourflow.view'};");
    const doc=new DOMParser().parseFromString(source,'text/html');doc.title='DAILY OVERVIEW';
    const management=doc.querySelector('.navbtn[data-page="management"]');if(!management)throw new Error('Management System navigation not found in pinned baseline.');
    const gateway=doc.createElement('button');gateway.className='navbtn';gateway.id='tourflowGateway';gateway.dataset.page='tourflow';gateway.textContent='✈ TourFlow';management.insertAdjacentElement('afterend',gateway);
    const dummy=doc.createElement('section');dummy.className='page';dummy.id='tourflow';dummy.hidden=true;(doc.getElementById('management')||doc.body).insertAdjacentElement?.('afterend',dummy)||doc.body.appendChild(dummy);
    const bridge=doc.createElement('script');bridge.textContent=`(()=>{document.addEventListener('click',e=>{const b=e.target.closest?.('#tourflowGateway');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();parent.postMessage({type:'TF_ENTER'},'*')},true)})();`;doc.body.insertBefore(bridge,doc.body.firstChild);
    daily.srcdoc='<!doctype html>\n'+doc.documentElement.outerHTML;tour.srcdoc=decode(TOUR_B64);boot.style.display='none';
  }catch(err){bootStatus.className='bad';bootStatus.textContent='Could not start DAILY OVERVIEW: '+(err?.message||String(err))}
}
window.addEventListener('message',e=>{if(e.source===daily.contentWindow&&e.data?.type==='TF_ENTER')enterTour()});
bootApp();
})();
