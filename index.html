  let tries=0;
  const tick=()=>{
    const c=clientIfReady(),u=currentUser();
    if(childReady&&c&&u){
      sendTourMessage('TF_PRELOAD');
      return;
    }
    if(++tries<80)warmTimer=setTimeout(tick,125);
  };
  warmTimer=setTimeout(tick,2500);

function pauseRealtime(){
  const c=clientIfReady();
  if(realtimeChannel&&c){try{c.removeChannel(realtimeChannel)}catch(_){}}
  realtimeChannel=null;realtimeUserId='';
  sendTourMessage('TF_DEACTIVATE');
}
function stopRealtime(){
  clearTimeout(warmTimer);warmTimer=null;
  pauseRealtime();workspaceReady=false;
  sendTourMessage('TF_SESSION_ENDED');
}
function notifyRemote(payload,kind='tour'){
  if(mode!=='tour'&&!pendingEnter)return;
  const uid=currentUserId();
  const actor=payload?.new?.updated_by||payload?.old?.updated_by||payload?.new?.owner_transferred_by||'';
  if(actor&&uid&&String(actor)===String(uid))return;
  if(kind==='directory')sendTourMessage('TF_DIRECTORY_CHANGED',{eventType:payload?.eventType||''});
  else sendTourMessage('TF_REMOTE_CHANGE',{eventType:payload?.eventType||'',tourId:payload?.new?.id||payload?.old?.id||'',at:Date.now()});
}
function setupRealtime(){
  if(mode!=='tour'&&!pendingEnter)return;
  const c=clientIfReady(),uid=currentUserId();
  if(!c||!uid)return;
  if(realtimeChannel&&realtimeUserId===uid)return;
  if(realtimeChannel){try{c.removeChannel(realtimeChannel)}catch(_){}}
  realtimeUserId=uid;
  const channel=c.channel('tourflow-live-'+uid+'-'+Math.random().toString(36).slice(2))
    .on('postgres_changes',{event:'*',schema:'public',table:'tourflow_tours'},payload=>notifyRemote(payload,'tour'))
    .on('postgres_changes',{event:'*',schema:'public',table:'tourflow_people_directory'},payload=>notifyRemote(payload,'directory'))
    .subscribe((status)=>{
      if(childReady)tour.contentWindow?.postMessage({type:'TF_REALTIME_STATUS',status},'*');
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        setTimeout(()=>{
          if(realtimeChannel===channel){
            try{c.removeChannel(channel)}catch(_){}
            realtimeChannel=null;if(mode==='tour'||pendingEnter)setupRealtime();
          }
        },1500);
      }
    });
  realtimeChannel=channel;
}

    case 'deleteTour':{const {error}=await c.rpc('tourflow_delete_tour',{p_tour_id:m.payload.tourId,p_confirm_name:m.payload.confirmName});if(error)throw error;return true}
    case 'takeOverTour':{const {data,error}=await c.rpc('tourflow_take_over',{p_tour_id:m.payload.tourId});if(error)throw error;return data}
    case 'transferTour':{const {data,error}=await c.rpc('tourflow_transfer_ownership',{p_tour_id:m.payload.tourId,p_new_owner_user_id:m.payload.newOwnerUserId});if(error)throw error;return data}
    case 'listCollaborators':{const {data,error}=await c.rpc('tourflow_list_collaborators',{p_tour_id:m.payload.tourId});if(error)throw error;return data||[]}
    case 'addCollaborator':{const {data,error}=await c.rpc('tourflow_add_collaborator',{p_tour_id:m.payload.tourId,p_user_id:m.payload.userId,p_role:m.payload.role||'Co-Organizer'});if(error)throw error;return data}

    default:throw new Error('Unsupported TourFlow operation');
  }
}
window.addEventListener('message',async e=>{
  const m=e.data||{};
  if(e.source===tour.contentWindow){
    if(m.type==='TF_CHILD_READY'){
      childReady=true;
      if(pendingActivation){const type=pendingActivation;pendingActivation=false;sendTourMessage(type)}
      warmTourFlowSoon();
      return;
    }
    if(m.type==='TF_WORKSPACE_READY'){
      workspaceReady=true;if(mode==='tour'||pendingEnter)setupRealtime();
      if(pendingEnter)finishEnter();
      return;
    }
    if(m.type==='TF_WORKSPACE_ERROR'){
      workspaceReady=false;
      if(pendingEnter){setAdventureStatus('TourFlow opened, but sync needs attention');finishEnter()}
      return;
    }
    if(m.type==='TF_EXIT_TO_DAILY_OVERVIEW'){exitTour();return}
    if(m.type==='TF_REQUEST'){
      try{const data=await handleRequest(m);tour.contentWindow.postMessage({type:'TF_RESPONSE',requestId:m.requestId,ok:true,data},'*')}
      catch(err){tour.contentWindow.postMessage({type:'TF_RESPONSE',requestId:m.requestId,ok:false,error:err?.message||String(err)},'*')}
      return;
    }
  }
  if(e.source===daily.contentWindow){
    if(m.type==='TF_ENTER'){enterTour();return}
    if(m.type==='TF_DAILY_SESSION_READY'){warmTourFlowSoon();return}
    if(m.type==='TF_DAILY_SESSION_ENDED'){stopRealtime();return}
  }
});

  }

  return await response.text();
}

  for(const [a,b] of patches)source=source.split(a).join(b);
  return source;
}
async function bootApp(){
  try{
    tour.srcdoc=decode(TOUR_B64);
    let source=await loadBaseline();
    source=applyDailyPerformancePatch(source);
    // Add TourFlow to the existing permission editor and page permission map BEFORE original scripts execute.
    // TourFlow editing is owner-based; no role-wide edit permission controls are injected.

    source=source.replace("management:'management.view'};","management:'management.view',tourflow:'tourflow.view'};");
    const doc=new DOMParser().parseFromString(source,'text/html');doc.title='DAILY OVERVIEW';
    const management=doc.querySelector('.navbtn[data-page="management"]');if(!management)throw new Error('Management System navigation not found in pinned baseline.');
    const gateway=doc.createElement('button');gateway.className='navbtn';gateway.id='tourflowGateway';gateway.dataset.page='tourflow';gateway.textContent='✈ TourFlow';management.insertAdjacentElement('afterend',gateway);
    const dummy=doc.createElement('section');dummy.className='page';dummy.id='tourflow';dummy.hidden=true;(doc.getElementById('management')||doc.body).insertAdjacentElement?.('afterend',dummy)||doc.body.appendChild(dummy);
    const bridge=doc.createElement('script');bridge.textContent=`(()=>{const tellReady=()=>parent.postMessage({type:'TF_DAILY_SESSION_READY'},'*');document.addEventListener('click',e=>{const b=e.target.closest?.('#tourflowGateway');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();parent.postMessage({type:'TF_ENTER'},'*')},true);window.addEventListener('daily-overview-session-ready',tellReady);window.addEventListener('daily-overview-session-ended',()=>parent.postMessage({type:'TF_DAILY_SESSION_ENDED'},'*'));setTimeout(()=>{if(window.dailyOverviewCurrentUser)tellReady()},0)})();`;doc.body.insertBefore(bridge,doc.body.firstChild);
    daily.srcdoc='<!doctype html>\n'+doc.documentElement.outerHTML;boot.style.display='none';warmTourFlowSoon();
  }catch(err){bootStatus.className='bad';bootStatus.textContent='Could not start DAILY OVERVIEW: '+(err?.message||String(err))}
}
bootApp();
})();
