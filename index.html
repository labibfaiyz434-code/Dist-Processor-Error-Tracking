const daily=document.getElementById('dailyFrame'),tour=document.getElementById('tourFrame'),adventure=document.getElementById('adventure'),boot=document.getElementById('boot'),bootStatus=document.getElementById('bootStatus');let mode='daily',busy=false,childReady=false,workspaceReady=false,pendingEnter=false,pendingActivation=false,
enterStartedAt=0,enterFallbackTimer=null,realtimeChannel=null,realtimeUserId='',warmTimer=null;
const decode=b64=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
function intro(enter){document.getElementById('advKicker').textContent=enter?'TourFlow':'Daily Overview';document.getElementById('advTitle').innerHTML=enter?'<span>WELCOME TO THE</span><span>NEXT ADVENTURE</span>':'<span>RETURNING TO</span><span>DAILY OVERVIEW</span>';document.getElementById('advSub').textContent=enter?'A new journey starts here':'Back to your command center'}
function setAdventureStatus(text){const el=document.getElementById('advSub');if(el)el.textContent=text}
function sendTourMessage(type,payload={}){
  if(!childReady){pendingActivation=type;return false}
  tour.contentWindow?.postMessage({type,payload},'*');return true;
}
function finishEnter(){
  if(!pendingEnter)return;
  const minDelay=Math.max(0,720-(Date.now()-enterStartedAt));
  clearTimeout(enterFallbackTimer);
  setTimeout(()=>{
    if(!pendingEnter)return;
    daily.style.display='none';tour.style.display='block';
    requestAnimationFrame(()=>tour.classList.add('show'));
    setTimeout(()=>{adventure.className='';mode='tour';busy=false;pendingEnter=false},360);
  },minDelay);
}
function enterTour(){
  if(busy||mode==='tour')return;
  clearTimeout(warmTimer);warmTimer=null;
  const can=daily.contentWindow?.dailyOverviewCan;
  if(typeof can==='function'&&!can('tourflow.view'))return alert('Your account does not have TourFlow permission.');
  busy=true;pendingEnter=true;enterStartedAt=Date.now();intro(true);
  setAdventureStatus(workspaceReady?'Opening your workspace…':'Syncing your workspace…');
  adventure.className='active';
  sendTourMessage('TF_ACTIVATE');
  setupRealtime();
  if(workspaceReady)finishEnter();
  enterFallbackTimer=setTimeout(()=>{
    if(pendingEnter){setAdventureStatus('Opening TourFlow…');finishEnter()}
  },9000);
}
function exitTour(){
  if(busy||mode==='daily')return;
  busy=true;pauseRealtime();intro(false);adventure.className='active exit';
  setTimeout(()=>{tour.classList.remove('show');daily.style.display='block'},600);
  setTimeout(()=>{tour.style.display='none';adventure.className='';mode='daily';busy=false},1300)
}
function client(){const c=daily.contentWindow?.dailyOverviewGetClient?.();if(!c)throw new Error('DAILY OVERVIEW database client is not ready. Sign in first.');return c}
function currentUser(){return daily.contentWindow?.dailyOverviewCurrentUser||null}
function clientIfReady(){try{return daily.contentWindow?.dailyOverviewGetClient?.()||null}catch(_){return null}}
function currentUserId(){const u=currentUser();return u?.user_id||u?.id||''}
function warmTourFlowSoon(){
  clearTimeout(warmTimer);
  if(navigator.connection?.saveData)return;
  let tries=0;
  const tick=()=>{
    const c=clientIfReady(),u=currentUser();
    if(childReady&&c&&u){
      sendTourMessage('TF_PRELOAD');
      return;
    }
    if(++tries<80)warmTimer=setTimeout(tick,125);
  };
  warmTimer=setTimeout(tick,2500);
}
function pauseRealtime(){
  const c=clientIfReady();
  if(realtimeChannel&&c){try{c.removeChannel(realtimeChannel)}catch(_){}}
  realtimeChannel=null;realtimeUserId='';
  sendTourMessage('TF_DEACTIVATE');
}
function stopRealtime(){
  clearTimeout(warmTimer);warmTimer=null;
  pauseRealtime();workspaceReady=false;
  sendTourMessage('TF_SESSION_ENDED');
}
function notifyRemote(payload,kind='tour'){
  if(mode!=='tour'&&!pendingEnter)return;
  const uid=currentUserId();
  const actor=payload?.new?.updated_by||payload?.old?.updated_by||payload?.new?.owner_transferred_by||'';
  if(actor&&uid&&String(actor)===String(uid))return;
  if(kind==='directory')sendTourMessage('TF_DIRECTORY_CHANGED',{eventType:payload?.eventType||''});
  else sendTourMessage('TF_REMOTE_CHANGE',{eventType:payload?.eventType||'',tourId:payload?.new?.id||payload?.old?.id||'',at:Date.now()});
}
function setupRealtime(){
  if(mode!=='tour'&&!pendingEnter)return;
  const c=clientIfReady(),uid=currentUserId();
  if(!c||!uid)return;
  if(realtimeChannel&&realtimeUserId===uid)return;
  if(realtimeChannel){try{c.removeChannel(realtimeChannel)}catch(_){}}
  realtimeUserId=uid;
  const channel=c.channel('tourflow-live-'+uid+'-'+Math.random().toString(36).slice(2))
    .on('postgres_changes',{event:'*',schema:'public',table:'tourflow_tours'},payload=>notifyRemote(payload,'tour'))
    .on('postgres_changes',{event:'*',schema:'public',table:'tourflow_people_directory'},payload=>notifyRemote(payload,'directory'))
    .subscribe((status)=>{
      if(childReady)tour.contentWindow?.postMessage({type:'TF_REALTIME_STATUS',status},'*');
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        setTimeout(()=>{
          if(realtimeChannel===channel){
            try{c.removeChannel(channel)}catch(_){}
            realtimeChannel=null;if(mode==='tour'||pendingEnter)setupRealtime();
          }
        },1500);
      }
    });
  realtimeChannel=channel;
}
async function handleRequest(m){
  const c=client();if(!currentUser())throw new Error('Login required. Sign in to DAILY OVERVIEW first.');
  switch(m.op){
    case 'loadWorkspace':{const {data,error}=await c.rpc('tourflow_load_workspace');if(error)throw error;return data||{}}
    case 'saveTourState':{const {error}=await c.rpc('tourflow_save_tour_state',{p_tour_id:m.payload.tourId,p_state:m.payload.state});if(error)throw error;return true}
    case 'directory':{const [a,b]=await Promise.all([c.rpc('tourflow_list_daily_members'),c.from('tourflow_people_directory').select('id,source_user_id,name,initial,phone,email,gender,date_of_birth,emergency_contact,notes,active').eq('active',true).order('name')]);if(a.error)throw a.error;if(b.error)throw b.error;return {daily:a.data||[],tourflow:b.data||[]}}
    case 'createPerson':{const p=m.payload.person||{};const {data,error}=await c.from('tourflow_people_directory').insert({source_type:'tourflow',name:p.name,initial:p.initial||null,phone:p.phone||null,email:p.email||null,gender:p.gender||null,date_of_birth:p.date_of_birth||null,emergency_contact:p.emergency_contact||null,notes:p.notes||null}).select('id,source_user_id,name,initial,phone,email,gender,date_of_birth,emergency_contact,notes,active').single();if(error)throw error;return data}
    case 'exportTour':{const {data,error}=await c.rpc('tourflow_export_tour',{p_tour_id:m.payload.tourId});if(error)throw error;return data}
    case 'markBackup':{const {data,error}=await c.rpc('tourflow_mark_backup_exported',{p_tour_id:m.payload.tourId,p_sha256:m.payload.sha256,p_record_count:m.payload.recordCount});if(error)throw error;return data}
    case 'deleteTour':{const {error}=await c.rpc('tourflow_delete_tour',{p_tour_id:m.payload.tourId,p_confirm_name:m.payload.confirmName});if(error)throw error;return true}
    case 'takeOverTour':{const {data,error}=await c.rpc('tourflow_take_over',{p_tour_id:m.payload.tourId});if(error)throw error;return data}
    case 'transferTour':{const {data,error}=await c.rpc('tourflow_transfer_ownership',{p_tour_id:m.payload.tourId,p_new_owner_user_id:m.payload.newOwnerUserId});if(error)throw error;return data}
    default:throw new Error('Unsupported TourFlow operation');
  }
}
window.addEventListener('message',async e=>{
  const m=e.data||{};
  if(e.source===tour.contentWindow){
    if(m.type==='TF_CHILD_READY'){
      childReady=true;
      if(pendingActivation){const type=pendingActivation;pendingActivation=false;sendTourMessage(type)}
      warmTourFlowSoon();
      return;
    }
    if(m.type==='TF_WORKSPACE_READY'){
      workspaceReady=true;if(mode==='tour'||pendingEnter)setupRealtime();
      if(pendingEnter)finishEnter();
      return;
    }
    if(m.type==='TF_WORKSPACE_ERROR'){
      workspaceReady=false;
      if(pendingEnter){setAdventureStatus('TourFlow opened, but sync needs attention');finishEnter()}
      return;
    }
    if(m.type==='TF_EXIT_TO_DAILY_OVERVIEW'){exitTour();return}
    if(m.type==='TF_REQUEST'){
      try{const data=await handleRequest(m);tour.contentWindow.postMessage({type:'TF_RESPONSE',requestId:m.requestId,ok:true,data},'*')}
      catch(err){tour.contentWindow.postMessage({type:'TF_RESPONSE',requestId:m.requestId,ok:false,error:err?.message||String(err)},'*')}
      return;
    }
  }
  if(e.source===daily.contentWindow){
    if(m.type==='TF_ENTER'){enterTour();return}
    if(m.type==='TF_DAILY_SESSION_READY'){warmTourFlowSoon();return}
    if(m.type==='TF_DAILY_SESSION_ENDED'){stopRealtime();return}
  }
});
async function loadBaseline(){
  if('caches' in window){
    try{
      const cache=await caches.open('daily-overview-baseline-46f99-v2');
      const hit=await cache.match(BASE_URL);
      if(hit)return await hit.text();
      const response=await fetch(BASE_URL,{cache:'force-cache'});
      if(!response.ok)throw new Error('Pinned DAILY OVERVIEW baseline returned HTTP '+response.status);
      cache.put(BASE_URL,response.clone()).catch(()=>{});
      return await response.text();
    }catch(err){console.warn('Baseline cache fallback',err)}
  }
  const response=await fetch(BASE_URL,{cache:'force-cache'});
  if(!response.ok)throw new Error('Pinned DAILY OVERVIEW baseline returned HTTP '+response.status);
